services:
  - type: web
    name: gmail-triage-mcp
    runtime: docker
    plan: free
    autoDeploy: true
    healthCheckPath: /healthz
    envVars:
      - key: MCP_BEARER_TOKEN
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_SESSION_SECRET
        sync: false
      - key: DATABASE_PATH
        value: /app/data/app.db
      - key: POLL_INTERVAL_SECONDS
        value: "60"
      - key: COOKIE_SECURE
        value: "true"
      - key: PUBLIC_BASE_URL
        sync: false
      - key: MCP_ISSUER_URL
        sync: false
      - key: MCP_RESOURCE_URL
        sync: false
      - key: MCP_SCOPE
        value: gmail:triage
      - key: MCP_ALLOWED_HOSTS
        sync: false
      - key: MCP_ALLOWED_ORIGINS
        sync: false
